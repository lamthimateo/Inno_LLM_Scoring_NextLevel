{% extends "_base.html" %}
{% block title %}Reset password · Inno LLM Scoring{% endblock %}
{% block page_slug %}auth-reset{% endblock %}

{% block content %}
<section class="authcard card">
  <h1 class="authcard__title">Choose a new password</h1>
  {% if error %}<div class="flash flash--err">{{ error }}</div>{% endif %}

  <form method="post" action="/auth/reset" class="form">
    <input type="hidden" name="token" value="{{ token }}" />

    <label class="form__row">
      <span class="form__label">New password</span>
      <input class="form__input" name="new_password" type="password" autocomplete="new-password" minlength="8" required autofocus />
    </label>

    <label class="form__row">
      <span class="form__label">Confirm new password</span>
      <input class="form__input" name="new_password_confirm" type="password" autocomplete="new-password" minlength="8" required />
    </label>

    <button class="btn btn--primary btn--full" type="submit">Reset password</button>
  </form>
</section>
{% endblock %}
