{% extends "base.html" %}
{% block title %}Set new password · LLM Arena{% endblock %}

{% block shell %}
<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <img class="brand-logo brand-logo-lg" src="{{ url_for('static', filename='img/logo.png') }}" alt="LLM Arena">
    </div>

    <h1>Set a new password</h1>
    <p class="sub">Paste your reset token and choose a new password.</p>

    {% include "components/_flash.html" %}

    <form method="post" action="{{ url_for('reset_password') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

      <div class="form-field">
        <label for="token">Reset token</label>
        <input class="input text-mono" id="token" name="token" type="text"
               required value="{{ request.query_params.get('token', '') if request else '' }}">
      </div>

      <div class="form-field">
        <label for="password">New password</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="new-password" minlength="8" required>
        <div class="pw-strength" data-pw-strength-for="#password" data-score="0" aria-hidden="true">
          <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
        </div>
      </div>

      <div class="form-field">
        <label for="password_confirm">Confirm new password</label>
        <input class="input" id="password_confirm" name="password_confirm" type="password"
               autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Update password</button>
    </form>

    <div class="alt">
      <a href="{{ url_for('login') }}">Back to sign in</a>
    </div>
  </div>
</main>
{% endblock %}
