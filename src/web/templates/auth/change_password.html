{% extends "base.html" %}
{% block title %}Change password · LLM Arena{% endblock %}

{% block content %}
<div class="page-header">
  <div class="title">
    <h1>Change your password</h1>
    <div class="sub">Logged in as <b class="soft">{{ current_user.username }}</b>.</div>
  </div>
</div>

{% if ok %}
  <div class="alert alert-success mb-4">
    <div class="alert-body"><div>{{ ok }}</div></div>
  </div>
{% endif %}
{% if error %}
  <div class="alert alert-error mb-4">
    <div class="alert-body"><div>{{ error }}</div></div>
  </div>
{% endif %}

<form method="post" action="{{ url_for('change_password') }}" class="stack" style="max-width: 480px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

  <div class="card">
    <div class="card-header"><h2>New password</h2></div>

    <div class="form-field">
      <label for="current_password">Current password</label>
      <input class="input" id="current_password" name="current_password" type="password"
             autocomplete="current-password" required autofocus>
    </div>

    <div class="form-field">
      <label for="new_password">New password</label>
      <input class="input" id="new_password" name="new_password" type="password"
             autocomplete="new-password" minlength="8" required>
      <div class="pw-strength" data-pw-strength-for="#new_password" data-score="0" aria-hidden="true">
        <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
      </div>
      <div class="help">At least 8 characters.</div>
    </div>

    <div class="form-field">
      <label for="new_password_confirm">Confirm new password</label>
      <input class="input" id="new_password_confirm" name="new_password_confirm" type="password"
             autocomplete="new-password" minlength="8" required>
    </div>
  </div>

  <div class="row" style="justify-content: flex-end;">
    <button class="btn btn-primary" type="submit">Update password</button>
  </div>
</form>
{% endblock %}
