{# Context: model_outputs — list of {model_id, raw_text} #}
{% if model_outputs %}
<section class="card">
  <div class="card-header">
    <h2>Model outputs</h2>
    <span class="muted text-sm">Raw text returned by each provider</span>
  </div>
  <div class="stack-tight">
    {% for mo in model_outputs %}
      <details class="output-block">
        <summary>
          <code class="kbd">{{ mo.model_id }}</code>
          <span class="muted text-sm fw-400">show output</span>
        </summary>
        <pre class="text-sm mt-2 mb-0">{{ mo.raw_text }}</pre>
      </details>
    {% endfor %}
  </div>
</section>
{% endif %}
