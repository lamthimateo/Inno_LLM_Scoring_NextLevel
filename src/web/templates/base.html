<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}LLM Arena{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head_extra %}{% endblock %}
  <script>
    // Apply theme before paint to avoid FOUC. Defaults to the Anthropic /
    // Claude warm-ivory light theme; user can opt into dark via the in-app
    // toggle (persisted in localStorage under "inno_theme").
    (function () {
      try {
        var saved = localStorage.getItem("inno_theme");
        document.documentElement.setAttribute("data-theme", saved || "light");
      } catch (e) { /* no-op */ }
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block shell %}
    {% include "components/_nav.html" %}

    <main class="page">
      <div class="container">
        {% block flash %}
          {% include "components/_flash.html" %}
        {% endblock %}

        {% block content %}{% endblock %}
      </div>
    </main>
  {% endblock %}

  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
