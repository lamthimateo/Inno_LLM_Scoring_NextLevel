{% extends "base.html" %}
{% block title %}500 · Server error · LLM Arena{% endblock %}

{% block content %}
<div class="empty">
  <div class="empty-code">500</div>
  <h2>Something went wrong</h2>
  <p>An unexpected error occurred. Try again in a minute.</p>
  <div class="row mt-3">
    <a class="btn btn-primary" href="{{ url_for('home') if current_user else url_for('login') }}">Go to dashboard</a>
    <button class="btn btn-ghost" onclick="window.location.reload();">Retry</button>
  </div>
  {% if request_id %}
    <div class="muted text-sm mt-4">
      Reference: <code class="kbd" data-copy="{{ request_id }}">{{ request_id }}</code>
      <span class="muted">(click to copy)</span>
    </div>
  {% endif %}
</div>
{% endblock %}
