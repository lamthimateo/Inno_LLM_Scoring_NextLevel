[project]
name = "inno-llm-scoring-nextlevel"
version = "0.2.0"
description = "LLM Arena — GUI-based LLM benchmark runner with review workflow, Postgres storage, and live multi-model evaluation."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "jinja2>=3.1,<4",
  "itsdangerous>=2.2,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<3.3",
  "alembic>=1.13,<2",
  "passlib[bcrypt]>=1.7.4,<2",
  "bcrypt>=4.2,<5",
  "redis>=5.0,<6",
  "rq>=1.16,<2",
  "openai==2.30.0",
  "anthropic>=0.40,<1",
  "google-genai>=1.0,<2",
  "mistralai>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "httpx>=0.27,<1",
  "playwright>=1.45,<2",
]

[project.scripts]
# The CLI is removed in v0.2.0. Run the app via `docker compose up`.
