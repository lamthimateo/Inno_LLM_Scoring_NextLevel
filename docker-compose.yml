services:
  postgres:
    image: postgres:16-alpine
    container_name: inno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benchmark}
      POSTGRES_USER: ${POSTGRES_USER:-benchmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark} -d ${POSTGRES_DB:-benchmark}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inno_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inno_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-benchmark}:${POSTGRES_PASSWORD:-benchmark}@postgres:5432/${POSTGRES_DB:-benchmark}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API: ${OPENROUTER_API:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_AGENT_ID: ${MISTRAL_AGENT_ID:-}
      MISTRAL_AGENT_VERSION: ${MISTRAL_AGENT_VERSION:-0}
      # Local models (Ollama). Default: Ollama running on the host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-600}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-inno-admin}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m src.web.seed &&
             uvicorn src.web.app:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./imports:/app/imports
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inno_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-benchmark}:${POSTGRES_PASSWORD:-benchmark}@postgres:5432/${POSTGRES_DB:-benchmark}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API: ${OPENROUTER_API:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_AGENT_ID: ${MISTRAL_AGENT_ID:-}
      MISTRAL_AGENT_VERSION: ${MISTRAL_AGENT_VERSION:-0}
      # Local models (Ollama). Default: Ollama running on the host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: rq worker --url redis://redis:6379/0 default
    volumes:
      - ./src:/app/src
      - ./imports:/app/imports

  # Optional local-model server, off by default. Start it with:
  #   docker compose --profile local up --build
  # and set OLLAMA_BASE_URL=http://ollama:11434 in .env.
  # Runs on the CPU: Docker on macOS cannot use the Apple GPU. On Apple Silicon
  # prefer Ollama on the host (see README, "Local models").
  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    container_name: inno_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ollama_models:
