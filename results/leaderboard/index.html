<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LLM Leaderboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: monospace;
    background: #f4efe5;
    color: #111;
    padding: 40px 24px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    border-bottom: 2px solid #111;
    padding-bottom: 10px;
    margin-bottom: 24px;
  }

  /* --- ADD FORM --- */
  .form {
    background: #ece7dc;
    border: 1px solid #aaa;
    padding: 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #777;
  }

  .field input {
    font-family: monospace;
    font-size: 12px;
    padding: 6px 9px;
    border: 1px solid #aaa;
    background: #f4efe5;
    color: #111;
    width: 110px;
    outline: none;
  }

  .field input:focus { border-color: #111; }
  .field.wide input  { width: 160px; }

  button {
    font-family: monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    padding: 8px 16px;
    cursor: pointer;
    border: 1px solid #111;
    background: #111;
    color: #f4efe5;
  }
  button:hover { background: #f4efe5; color: #111; }

  #msg { font-size: 11px; color: #c00; }

  /* --- CONTROLS --- */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .controls input {
    font-family: monospace;
    font-size: 12px;
    padding: 6px 10px;
    border: 1px solid #aaa;
    background: transparent;
    color: #111;
    outline: none;
    width: 200px;
  }
  .controls input:focus { border-color: #111; }

  /* --- TABLE --- */
  .table-wrap { overflow-x: auto; border-left: 3px solid #111; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }

  th {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #777;
    text-align: left;
    padding: 8px 12px;
    background: #ece7dc;
    border-bottom: 2px solid #111;
    border-right: 1px solid #ccc;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  th:hover { color: #111; }
  th.sorted { color: #111; }
  th:last-child { border-right: none; }

  td {
    padding: 8px 12px;
    border-bottom: 1px solid #ddd;
    border-right: 1px solid #ddd;
    white-space: nowrap;
  }
  td:last-child { border-right: none; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #ece7dc; }

  .pos { color: #00a050; font-weight: 700; }
  .neg { color: #d02020; font-weight: 700; }
  .muted { color: #888; }

  .del-btn {
    font-size: 10px;
    padding: 2px 7px;
    background: transparent;
    color: #aaa;
    border: 1px solid #ccc;
  }
  .del-btn:hover { color: #d02020; border-color: #d02020; background: transparent; }

  .leader-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    background: #00a050;
    color: #fff;
    padding: 1px 5px;
    margin-left: 6px;
  }

  /* toast */
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #111; color: #f4efe5;
    font-family: monospace;
    font-size: 12px; font-weight: 700;
    padding: 10px 16px;
    border-left: 3px solid #00a050;
    opacity: 0; transform: translateY(20px);
    transition: all .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>

<h1>LLM Leaderboard</h1>

<!-- FORM -->
<div class="form">
  <div class="field wide"><label>model id *</label><input id="f_id" placeholder="e.g. claude4"/></div>
  <div class="field"><label>total</label><input id="f_total" type="number" placeholder="0"/></div>
  <div class="field"><label>chemistry</label><input id="f_chem" type="number" placeholder="0"/></div>
  <div class="field"><label>emotions</label><input id="f_emot" type="number" placeholder="0"/></div>
  <div class="field"><label>math</label><input id="f_math" type="number" placeholder="0"/></div>
  <div class="field"><label>reasoning3d</label><input id="f_r3d" type="number" placeholder="0"/></div>
  <div class="field"><label>no_knowledge</label><input id="f_nok" type="number" placeholder="0"/></div>
  <div class="field"><label>contradiction</label><input id="f_con" type="number" placeholder="0"/></div>
  <div class="field"><label>correct</label><input id="f_cor" type="number" placeholder="0"/></div>
  <div class="field"><label>wrong</label><input id="f_wrg" type="number" placeholder="0"/></div>
  <div class="field"><label>blank</label><input id="f_blk" type="number" placeholder="0"/></div>
  <div class="field"><label>fmt violations</label><input id="f_fmt" type="number" placeholder="0"/></div>
  <button onclick="addRow()">+ Add</button>
  <span id="msg"></span>
</div>

<!-- SEARCH -->
<div class="controls">
  <input id="srch" placeholder="Filter models..." oninput="render()"/>
</div>

<!-- TABLE -->
<div class="table-wrap">
  <table>
    <thead><tr id="hdr"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
let data = [];
let sortKey = 'total';
let sortDir = -1;

const cols = [
  { k: '_del',              label: ''              },
  { k: 'model_id',          label: 'Model'         },
  { k: 'total',             label: 'Total'         },
  { k: 'correct',           label: 'Correct'       },
  { k: 'wrong',             label: 'Wrong'         },
  { k: 'chemistry',         label: 'Chemistry'     },
  { k: 'emotions',          label: 'Emotions'      },
  { k: 'math',              label: 'Math'          },
  { k: 'reasoning3d',       label: 'Reasoning 3D'  },
  { k: 'no_knowledge',      label: 'No Knowledge'  },
  { k: 'contradiction',     label: 'Contradiction' },
  { k: 'blank',             label: 'Blank'         },
  { k: 'format_violations', label: 'Fmt Violations'},
];

// Load JSON
fetch('./leaderboard.json')
  .then(r => r.json())
  .then(json => { data = json; render(); })
  .catch(() => { data = []; render(); });

function getRank(id) {
  return [...data].sort((a, b) => b.total - a.total).findIndex(r => r.model_id === id) + 1;
}

function scoreCell(v, isTotal) {
  if (isTotal) {
    const cls = v > 0 ? 'pos' : v < 0 ? 'neg' : 'muted';
    return `<span class="${cls}">${v > 0 ? '+' : ''}${v}</span>`;
  }
  if (v === 0) return `<span class="muted">0</span>`;
  const cls = v > 0 ? 'pos' : 'neg';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${v}</span>`;
}

function render() {
  const q = document.getElementById('srch').value.toLowerCase();
  let rows = data.filter(r => r.model_id.toLowerCase().includes(q));
  rows.sort((a, b) => {
    const av = a[sortKey] ?? 0, bv = b[sortKey] ?? 0;
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });

  // Header
  document.getElementById('hdr').innerHTML = cols.map(c => {
    if (c.k === '_del') return `<th style="width:36px;cursor:default"></th>`;
    const sorted = c.k === sortKey;
    return `<th class="${sorted ? 'sorted' : ''}" onclick="sort('${c.k}')">
      ${c.label} ${sorted ? (sortDir === -1 ? '↓' : '↑') : ''}
    </th>`;
  }).join('');

  // Rows
  document.getElementById('tbody').innerHTML = rows.map(row => {
    const rank = getRank(row.model_id);
    const tag = rank === 1 ? '<span class="leader-tag">leader</span>' : '';
    return `<tr>${cols.map(c => {
      if (c.k === '_del')     return `<td><button class="del-btn" onclick="del('${row.model_id}')">✕</button></td>`;
      if (c.k === 'model_id') return `<td><b>${row.model_id}</b>${tag}</td>`;
      if (c.k === 'total')    return `<td>${scoreCell(row.total, true)}</td>`;
      if (['correct','wrong','blank','format_violations'].includes(c.k)) return `<td><span class="muted">${row[c.k]}</span></td>`;
      return `<td>${scoreCell(row[c.k] ?? 0, false)}</td>`;
    }).join('')}</tr>`;
  }).join('') || `<tr><td colspan="${cols.length}" style="padding:24px;color:#888">No results.</td></tr>`;
}

function sort(k) {
  sortDir = sortKey === k ? sortDir * -1 : -1;
  sortKey = k;
  render();
}

function n(id) { return parseInt(document.getElementById(id).value) || 0; }

function addRow() {
  const id = document.getElementById('f_id').value.trim();
  const msg = document.getElementById('msg');
  if (!id) { msg.textContent = 'model_id required'; return; }
  if (data.find(r => r.model_id === id)) { msg.textContent = `"${id}" already exists`; return; }
  msg.textContent = '';
  data.push({ model_id: id, total: n('f_total'), chemistry: n('f_chem'), emotions: n('f_emot'), math: n('f_math'), reasoning3d: n('f_r3d'), no_knowledge: n('f_nok'), contradiction: n('f_con'), correct: n('f_cor'), wrong: n('f_wrg'), blank: n('f_blk'), format_violations: n('f_fmt') });
  ['f_id','f_total','f_chem','f_emot','f_math','f_r3d','f_nok','f_con','f_cor','f_wrg','f_blk','f_fmt'].forEach(i => document.getElementById(i).value = '');
  render();
  toast(`Added "${id}"`);
}

function del(id) {
  data = data.filter(r => r.model_id !== id);
  render();
  toast(`Removed "${id}"`);
}

let tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('show'), 2000);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.closest('.form')) addRow();
});
</script>
</body>
</html>
